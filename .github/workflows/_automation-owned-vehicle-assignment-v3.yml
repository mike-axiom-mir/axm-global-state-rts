name: Automation owned vehicle assignment v3

on:
  push:
    branches:
      - rts-host-owned-vehicle-assignment-20260915

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reuse bounded patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/_automation-owned-vehicle-assignment-patch-v2.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(lines) if "python - <<'PY'" in l) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          Path('/tmp/apply_patch.py').write_text(script)
          PY
          python /tmp/apply_patch.py
      - name: Exact focused syntax and authority evidence
        run: |
          node --check src/hosted/durable-world-run-command-authority.mjs
          node --check src/hosted/world-run-http-api.mjs
          node --check tests/world-run-vehicle-assignment-authority-selftest.mjs
          node tests/world-run-vehicle-assignment-authority-selftest.mjs
          node tests/world-run-vehicle-construction-authority-selftest.mjs
      - name: Full deterministic suite
        run: npm test
      - name: Commit tested product patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hosted/durable-world-run-command-authority.mjs src/hosted/world-run-http-api.mjs tests/world-run-vehicle-assignment-authority-selftest.mjs
          git commit -m 'Validate vehicle assignment against owned durable registry'
          git push origin HEAD:rts-host-owned-vehicle-assignment-20260915

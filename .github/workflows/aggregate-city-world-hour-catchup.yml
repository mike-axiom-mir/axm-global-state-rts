name: Aggregate city world-hour catch-up proof

on:
  pull_request:
    paths:
      - src/hosted/aggregate-city-world-hour-catchup.mjs
      - src/hosted/journal-store.mjs
      - src/hosted/world-clock.mjs
      - src/sim/aggregate-city.mjs
      - src/world/world-landmarks.mjs
      - tests/aggregate-city-world-hour-catchup-selftest.mjs
      - tests/browser/world-entry.spec.js
      - tests/browser/planet-shell-controller.spec.js
      - scripts/serve.mjs
      - .github/workflows/aggregate-city-world-hour-catchup.yml
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  logical-city-catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out game and pinned Planet
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run deterministic and source gates
        run: |
          npm test
          node tests/aggregate-city-world-hour-catchup-selftest.mjs
          node --check src/hosted/aggregate-city-world-hour-catchup.mjs
          node --check tests/aggregate-city-world-hour-catchup-selftest.mjs
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start development world host
        run: |
          AXM_SHARED_WRITE_MODE=dev \
          AXM_WORLD_JOURNAL_PATH=/tmp/axm-logical-catchup-world-journal.json \
          AXM_WORLD_ACCOUNTS_PATH=/tmp/axm-logical-catchup-world-accounts.json \
          node scripts/serve.mjs > /tmp/axm-global-state-rts-logical-catchup-server.log 2>&1 &
          echo $! > /tmp/axm-global-state-rts-logical-catchup-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/world-entry.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-global-state-rts-logical-catchup-server.log
          exit 1
      - name: Regress human-machine world entry and controller shell in Chromium
        run: npx playwright test tests/browser/world-entry.spec.js tests/browser/planet-shell-controller.spec.js --reporter=line
      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-city-world-hour-catchup-proof
          path: |
            test-results/global-state-rts-*.png
            /tmp/axm-global-state-rts-logical-catchup-server.log
          if-no-files-found: warn
          retention-days: 14

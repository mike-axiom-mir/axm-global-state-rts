name: Automation build vehicle assignment authority

on:
  push:
    branches:
      - automation/world-run-vehicle-assignment-authority

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: automation/world-run-vehicle-assignment-authority
          fetch-depth: 0
      - name: Patch bounded host vehicle assignment authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} replacements, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          host = 'src/hosted/durable-world-run-command-authority.mjs'
          replace_once(
              host,
              "export const WORLD_RUN_LICENSE_UNIT_ACTION = 'license-unit-vehicle';\nexport const WORLD_RUN_CRAFT_WEAPON_ACTION = 'craft-weapon';",
              "export const WORLD_RUN_LICENSE_UNIT_ACTION = 'license-unit-vehicle';\nexport const WORLD_RUN_ASSIGN_VEHICLE_ACTION = 'assign-vehicle';\nexport const WORLD_RUN_CRAFT_WEAPON_ACTION = 'craft-weapon';"
          )
          replace_once(
              host,
              "      result = Object.freeze({ licensing: cloneJson(licensed), runRevision: run.revision });\n    } else if (mutation.action === WORLD_RUN_CRAFT_WEAPON_ACTION) {",
              "      result = Object.freeze({ licensing: cloneJson(licensed), runRevision: run.revision });\n    } else if (mutation.action === WORLD_RUN_ASSIGN_VEHICLE_ACTION) {\n      const unitId = nonEmpty(mutation.payload?.unitId, 'unitId');\n      const vehicleId = nonEmpty(mutation.payload?.vehicleId, 'vehicleId');\n      const vehicleClass = nonEmpty(mutation.payload?.vehicleClass, 'vehicleClass');\n      const assigned = run.assignVehicle(unitId, { vehicleId, vehicleClass });\n      if (!assigned.accepted) throw new Error(`durable vehicle assignment replay rejected: ${progression.playerId}:${mutation.mutationId}:${assigned.reason}`);\n      result = Object.freeze({ assignment: cloneJson(assigned), runRevision: run.revision });\n    } else if (mutation.action === WORLD_RUN_CRAFT_WEAPON_ACTION) {"
          )
          replace_once(
              host,
              "  #weaponCraftPreflight(context, weaponId, count) {",
              "  #vehicleAssignmentPreflight(context, unitId, vehicleId, vehicleClass) {\n    const run = context.progression.activeRun;\n    const unit = run.manpower.unit(unitId);\n    if (!unit) throw new RangeError(`unknown unit: ${unitId}`);\n    if (!VEHICLE_LICENSES[vehicleClass]) throw new RangeError(`unknown vehicleClass: ${vehicleClass}`);\n    if (!unit.licenses.includes(vehicleClass)) return Object.freeze({ accepted: false, reason: 'required-license-missing', requiredLicense: vehicleClass, unit });\n    if (unit.assignedVehicleId === vehicleId) return Object.freeze({ accepted: false, reason: 'vehicle-already-assigned', unit });\n    if (unit.assignedVehicleId) return Object.freeze({ accepted: false, reason: 'unit-already-assigned-vehicle', assignedVehicleId: unit.assignedVehicleId, unit });\n    return null;\n  }\n\n  #weaponCraftPreflight(context, weaponId, count) {"
          )
          replace_once(
              host,
              "durableMutationActions: Object.freeze([WORLD_RUN_GLOBAL_CONTROL_ACTION, WORLD_RUN_FOOD_POLICY_ACTION, WORLD_RUN_TRAIN_UNIT_ACTION, WORLD_RUN_LICENSE_UNIT_ACTION, WORLD_RUN_CRAFT_WEAPON_ACTION, WORLD_RUN_EQUIP_WEAPON_ACTION, WORLD_RUN_CLOSE_ACTION]),",
              "durableMutationActions: Object.freeze([WORLD_RUN_GLOBAL_CONTROL_ACTION, WORLD_RUN_FOOD_POLICY_ACTION, WORLD_RUN_TRAIN_UNIT_ACTION, WORLD_RUN_LICENSE_UNIT_ACTION, WORLD_RUN_ASSIGN_VEHICLE_ACTION, WORLD_RUN_CRAFT_WEAPON_ACTION, WORLD_RUN_EQUIP_WEAPON_ACTION, WORLD_RUN_CLOSE_ACTION]),"
          )
          replace_all(host, 'vehicle-licensing-weapon-crafting', 'vehicle-licensing-vehicle-assignment-reference-weapon-crafting', minimum=3)
          replace_once(
              host,
              "  craftWeapon({ participantId, runId, mutationId, weaponId, count = 1, timestampMs } = {}) {",
              "  assignUnitVehicle({ participantId, runId, mutationId, unitId, vehicleId, vehicleClass = 'light-vehicle', timestampMs } = {}) {\n    const unit = nonEmpty(unitId, 'unitId');\n    const vehicle = nonEmpty(vehicleId, 'vehicleId');\n    const vehicleType = nonEmpty(vehicleClass, 'vehicleClass');\n    const context = this.#activeRunCommandContext({ participantId, runId, mutationId, action: WORLD_RUN_ASSIGN_VEHICLE_ACTION, payload: { unitId: unit, vehicleId: vehicle, vehicleClass: vehicleType } });\n    if (context.rejection) return context.rejection;\n    if (context.existing) {\n      return this.#reconcileExisting({\n        ...context,\n        resultFactory: progression => ({\n          assignment: Object.freeze({ accepted: true, unit: progression.activeRun.manpower.unit(unit) }),\n          runRevision: progression.activeRun.revision\n        })\n      });\n    }\n    const preflight = this.#vehicleAssignmentPreflight(context, unit, vehicle, vehicleType);\n    if (preflight) {\n      return Object.freeze({\n        schema: DURABLE_WORLD_RUN_MUTATION_AUTHORITY_SCHEMA,\n        accepted: false,\n        reason: preflight.reason,\n        participantId: context.record.participantId,\n        runId: context.expectedRunId,\n        mutationId: context.commandId,\n        assignment: preflight,\n        progressionPersistence: this.progressionPersistenceMeta(),\n        progression: context.progression.snapshot(),\n        truthBoundary: 'vehicle-assignment-was-not-admitted-or-persisted-because-the-authoritative-active-run-license-and-assignment-preconditions-were-not-met;vehicle-existence-ownership-and-production-are-not-claimed-by-this-reference-command'\n      });\n    }\n    return this.#admitPersistApply({ ...context, actionId: 'world-run-assign-vehicle', action: WORLD_RUN_ASSIGN_VEHICLE_ACTION, payload: { unitId: unit, vehicleId: vehicle, vehicleClass: vehicleType }, timestampMs, successTruthBoundary: 'host-admitted-vehicle-assignment-reference-was-durably-recorded-before-manpower-application-and-replays-in-command-order-after-restart;this-does-not-prove-vehicle-existence-ownership-or-production' });\n  }\n\n  craftWeapon({ participantId, runId, mutationId, weaponId, count = 1, timestampMs } = {}) {"
          )

          http = 'src/hosted/world-run-http-api.mjs'
          replace_once(
              http,
              "  WORLD_RUN_LICENSE_UNIT_ACTION,\n  WORLD_RUN_TRAIN_UNIT_ACTION,",
              "  WORLD_RUN_LICENSE_UNIT_ACTION,\n  WORLD_RUN_ASSIGN_VEHICLE_ACTION,\n  WORLD_RUN_TRAIN_UNIT_ACTION,"
          )
          replace_once(http, "export const WORLD_RUN_HTTP_API_SCHEMA = 'axm.global-state-rts.world-run-http-api/v0.12';", "export const WORLD_RUN_HTTP_API_SCHEMA = 'axm.global-state-rts.world-run-http-api/v0.13';")
          replace_once(
              http,
              "      if (verb === 'POST' && route === '/api/world/run/craft-weapon') {",
              "      if (verb === 'POST' && route === '/api/world/run/assign-vehicle') {\n        if (this.writeMode !== 'dev') return response(403, { error: 'world writes disabled', writeMode: this.writeMode });\n        const assignmentAuthority = authorityWithMethod(this.runAuthority, 'assignUnitVehicle');\n        if (!assignmentAuthority) return response(503, { error: 'host vehicle-assignment authority unavailable' });\n        const result = assignmentAuthority.assignUnitVehicle({\n          participantId: body.participantId,\n          runId: body.runId,\n          mutationId: body.mutationId,\n          unitId: body.unitId,\n          vehicleId: body.vehicleId,\n          vehicleClass: body.vehicleClass,\n          timestampMs: finiteHostTime(this.clock)\n        });\n        return response(runMutationStatus(result), result);\n      }\n\n      if (verb === 'POST' && route === '/api/world/run/craft-weapon') {"
          )
          replace_once(
              http,
              "              WORLD_RUN_LICENSE_UNIT_ACTION,\n              WORLD_RUN_CRAFT_WEAPON_ACTION,",
              "              WORLD_RUN_LICENSE_UNIT_ACTION,\n              WORLD_RUN_ASSIGN_VEHICLE_ACTION,\n              WORLD_RUN_CRAFT_WEAPON_ACTION,"
          )
          replace_once(
              http,
              "            durableVehicleLicensingEndpoint: '/api/world/run/license-unit',\n            durableWeaponCraftingEndpoint:",
              "            durableVehicleLicensingEndpoint: '/api/world/run/license-unit',\n            durableVehicleAssignmentEndpoint: '/api/world/run/assign-vehicle',\n            durableWeaponCraftingEndpoint:"
          )
          replace_all(http, 'vehicle-licensing weapon-crafting', 'vehicle-licensing vehicle-assignment-reference weapon-crafting', minimum=4)

          contract = 'src/hosted/shared-world-authority-contract.mjs'
          replace_once(
              contract,
              "  WORLD_RUN_LICENSE_UNIT_ACTION,\n  WORLD_RUN_TRAIN_UNIT_ACTION",
              "  WORLD_RUN_LICENSE_UNIT_ACTION,\n  WORLD_RUN_ASSIGN_VEHICLE_ACTION,\n  WORLD_RUN_TRAIN_UNIT_ACTION"
          )
          replace_once(
              contract,
              "  WORLD_RUN_LICENSE_UNIT_ACTION,\n  WORLD_RUN_CRAFT_WEAPON_ACTION,",
              "  WORLD_RUN_LICENSE_UNIT_ACTION,\n  WORLD_RUN_ASSIGN_VEHICLE_ACTION,\n  WORLD_RUN_CRAFT_WEAPON_ACTION,"
          )
          replace_once(contract, "'axm.global-state-rts.shared-world-authority-contract/v0.1';", "'axm.global-state-rts.shared-world-authority-contract/v0.2';")

          test_contract = 'tests/shared-world-authority-contract-selftest.mjs'
          replace_once(test_contract, 'assert.equal(contract.durableRunAuthority.actionIds.length, 7);', 'assert.equal(contract.durableRunAuthority.actionIds.length, 8);')
          replace_once(
              test_contract,
              "assert.equal(contract.durableRunAuthority.actionIds.includes('assign-vehicle'), false,\n  'contract must not claim vehicle assignment before that command is durable');",
              "assert.equal(contract.durableRunAuthority.actionIds.includes('assign-vehicle'), true,\n  'contract should claim vehicle assignment only after that command is durable');"
          )

          assignment_test = r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { WORLD_HOUR_MS } from '../src/hosted/world-clock.mjs';
          import { createFileWorldAccountStore } from '../src/hosted/world-account-store.mjs';
          import { createFileWorldRunArchiveStore } from '../src/hosted/world-run-archive-store.mjs';
          import { createWorldRunHttpApiService } from '../src/hosted/world-run-http-api.mjs';
          import { createFileWorldRunStartStore } from '../src/hosted/world-run-start-store.mjs';
          import { createWorldSessionAuthority } from '../src/hosted/world-session-authority.mjs';

          function post(api, pathname, body = {}) { return api.handle({ method: 'POST', pathname, body }); }
          function get(api, pathname, searchParams = {}) { return api.handle({ method: 'GET', pathname, searchParams }); }

          function createApi({ accountPath, runStartPath, archivePath, clock }) {
            const authority = createWorldSessionAuthority({ worldEpochMs: 0, accountStore: createFileWorldAccountStore(accountPath) });
            const api = createWorldRunHttpApiService({
              authority,
              runStartStore: createFileWorldRunStartStore(runStartPath),
              runArchiveStore: createFileWorldRunArchiveStore(archivePath),
              writeMode: 'dev',
              clock
            });
            return { authority, api };
          }

          function startRun(api, clockState, { accountId, controllerKind, runId }) {
            const entered = post(api, '/api/world/enter/account', { accountId, displayName: accountId, controllerKind });
            assert.equal(entered.status, 200);
            const participantId = entered.body.participant.participantId;
            clockState.nowMs += 2 * WORLD_HOUR_MS;
            assert.equal(post(api, '/api/world/chests/accrue', { participantId }).status, 200);
            const opened = post(api, '/api/world/chests/open', { participantId, count: 1 });
            assert.equal(opened.status, 200);
            assert.equal(opened.body.accepted, true);
            clockState.nowMs += 1;
            const started = post(api, '/api/world/run/begin-next-drop', {
              participantId,
              runId,
              runOptions: { crewCount: 9, foodPolicy: 'normal', extraStartingResources: { scrap: 200, 'industrial-metal': 20 } }
            });
            assert.equal(started.status, 200);
            assert.equal(started.body.accepted, true);
            assert.equal(started.body.runStartPersistence.persisted, true);
            const crew = started.body.progression.activeRun.manpower.units.find(unit => unit.role === 'crew');
            assert.ok(crew?.id);
            return { participantId, runId, unitId: crew.id };
          }

          function train(api, clockState, run, mutationId) {
            clockState.nowMs += 1;
            return post(api, '/api/world/run/train-unit', { participantId: run.participantId, runId: run.runId, mutationId, unitId: run.unitId, roleId: 'citizen' });
          }

          function license(api, clockState, run, mutationId) {
            clockState.nowMs += 1;
            return post(api, '/api/world/run/license-unit', { participantId: run.participantId, runId: run.runId, mutationId, unitId: run.unitId, licenseId: 'light-vehicle' });
          }

          function assign(api, clockState, run, mutationId, vehicleId) {
            clockState.nowMs += 1;
            return post(api, '/api/world/run/assign-vehicle', { participantId: run.participantId, runId: run.runId, mutationId, unitId: run.unitId, vehicleId, vehicleClass: 'light-vehicle' });
          }

          const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'axm-world-run-vehicle-assignment-'));
          const accountPath = path.join(tempDir, 'accounts.json');
          const runStartPath = path.join(tempDir, 'run-starts.json');
          const archivePath = path.join(tempDir, 'run-archive.json');

          try {
            const clockState = { nowMs: 420 * WORLD_HOUR_MS };
            const clock = () => clockState.nowMs;
            const first = createApi({ accountPath, runStartPath, archivePath, clock });
            const human = startRun(first.api, clockState, { accountId: 'assign-human', controllerKind: 'human', runId: 'run:assign:human:001' });
            const machine = startRun(first.api, clockState, { accountId: 'assign-machine', controllerKind: 'machine', runId: 'run:assign:machine:001' });

            const unlicensed = assign(first.api, clockState, human, 'assign:human:before-license', 'vehicle:human:probe');
            assert.equal(unlicensed.status, 400);
            assert.equal(unlicensed.body.accepted, false);
            assert.equal(unlicensed.body.reason, 'required-license-missing');
            assert.equal(unlicensed.body.admission, undefined);
            assert.equal(unlicensed.body.progression.activeRun.manpower.units.find(unit => unit.id === human.unitId).assignedVehicleId, null);

            for (const [run, suffix] of [[human, 'human'], [machine, 'machine']]) {
              const trained = train(first.api, clockState, run, `train:assign:${suffix}`);
              assert.equal(trained.status, 200);
              assert.equal(trained.body.accepted, true);
              const licensed = license(first.api, clockState, run, `license:assign:${suffix}`);
              assert.equal(licensed.status, 200);
              assert.equal(licensed.body.accepted, true);
            }

            const humanVehicleId = 'vehicle:human:scout-01';
            const machineVehicleId = 'vehicle:machine:scout-01';
            const humanMutationId = 'assign:human:light';
            const machineMutationId = 'assign:machine:light';
            const humanAssignment = assign(first.api, clockState, human, humanMutationId, humanVehicleId);
            const machineAssignment = assign(first.api, clockState, machine, machineMutationId, machineVehicleId);

            for (const [run, result, vehicleId] of [[human, humanAssignment, humanVehicleId], [machine, machineAssignment, machineVehicleId]]) {
              assert.equal(result.status, 200);
              assert.equal(result.body.accepted, true);
              assert.equal(result.body.reconciled, false);
              assert.equal(result.body.result.assignment.accepted, true);
              assert.equal(result.body.result.assignment.unit.id, run.unitId);
              assert.equal(result.body.result.assignment.unit.assignedVehicleId, vehicleId);
              assert.equal(result.body.result.assignment.unit.assignedVehicleClass, 'light-vehicle');
              assert.equal(result.body.mutationPersistence.persisted, true);
              assert.equal(result.body.mutationPersistence.mutation.action, 'assign-vehicle');
              assert.deepEqual(result.body.mutationPersistence.mutation.payload, { unitId: run.unitId, vehicleId, vehicleClass: 'light-vehicle' });
              assert.match(result.body.truthBoundary, /does-not-prove-vehicle-existence-ownership-or-production/);
              assert.equal(result.body.humanMachineParity, 'same-world-account-command-path-action-budget-and-durable-mutation-order-regardless-of-controller-kind');
            }

            assert.equal(humanAssignment.body.admission.controllerKind, 'human');
            assert.equal(machineAssignment.body.admission.controllerKind, 'machine');
            assert.equal(humanAssignment.body.admission.cooldownModel, 'shared-rolling-window-human-machine-parity');
            assert.equal(machineAssignment.body.admission.cooldownModel, 'shared-rolling-window-human-machine-parity');
            assert.equal(first.authority.participant(human.participantId).apmCap, 100);
            assert.equal(first.authority.participant(machine.participantId).apmCap, 100);

            const duplicate = assign(first.api, clockState, human, humanMutationId, humanVehicleId);
            assert.equal(duplicate.status, 200);
            assert.equal(duplicate.body.accepted, true);
            assert.equal(duplicate.body.reconciled, true);
            assert.equal(duplicate.body.result.assignment.unit.assignedVehicleId, humanVehicleId);
            assert.equal(duplicate.body.mutationPersistence.reused, true);
            assert.equal(duplicate.body.admission, undefined);

            const conflict = assign(first.api, clockState, human, humanMutationId, 'vehicle:human:other');
            assert.equal(conflict.status, 409);
            assert.match(conflict.body.error, /durable run mutation id conflict/);

            const secondAssignment = assign(first.api, clockState, human, 'assign:human:second', 'vehicle:human:second');
            assert.equal(secondAssignment.status, 400);
            assert.equal(secondAssignment.body.accepted, false);
            assert.equal(secondAssignment.body.reason, 'unit-already-assigned-vehicle');
            assert.equal(secondAssignment.body.admission, undefined);

            const durableBeforeRestart = JSON.parse(fs.readFileSync(runStartPath, 'utf8'));
            for (const run of [human, machine]) {
              const durable = durableBeforeRestart.records.find(entry => entry.participantId === run.participantId);
              assert.deepEqual(durable.mutations.map(entry => entry.action), ['train-unit-specialization', 'license-unit-vehicle', 'assign-vehicle']);
            }

            clockState.nowMs += 1;
            const humanFood = post(first.api, '/api/world/run/food-policy', { participantId: human.participantId, runId: human.runId, mutationId: 'food-after-assignment:human', policyId: 'rations' });
            assert.equal(humanFood.status, 200);
            clockState.nowMs += 1;
            const machineControl = post(first.api, '/api/world/run/global-control', { participantId: machine.participantId, runId: machine.runId, mutationId: 'control-after-assignment:machine', percent: 33 });
            assert.equal(machineControl.status, 200);

            const restarted = createApi({ accountPath, runStartPath, archivePath, clock });
            const humanAfterRestart = get(restarted.api, '/api/world/run', { participantId: human.participantId });
            const machineAfterRestart = get(restarted.api, '/api/world/run', { participantId: machine.participantId });
            assert.equal(humanAfterRestart.status, 200);
            assert.equal(machineAfterRestart.status, 200);
            const humanUnit = humanAfterRestart.body.progression.activeRun.manpower.units.find(unit => unit.id === human.unitId);
            const machineUnit = machineAfterRestart.body.progression.activeRun.manpower.units.find(unit => unit.id === machine.unitId);
            assert.equal(humanUnit.assignedVehicleId, humanVehicleId);
            assert.equal(humanUnit.assignedVehicleClass, 'light-vehicle');
            assert.equal(machineUnit.assignedVehicleId, machineVehicleId);
            assert.equal(machineUnit.assignedVehicleClass, 'light-vehicle');
            assert.equal(humanAfterRestart.body.progression.activeRun.food.policy, 'rations');
            assert.equal(machineAfterRestart.body.progression.activeRun.economy.peakGlobalControlPercent, 33);
            assert.equal(humanAfterRestart.body.mutationContinuity.appliedMutationCountThisProcess, 4);
            assert.equal(machineAfterRestart.body.mutationContinuity.appliedMutationCountThisProcess, 4);
            assert.equal(humanAfterRestart.body.continuity.state, 'run-start-and-mutations-restored-from-durable-record');
            assert.equal(machineAfterRestart.body.continuity.state, 'run-start-and-mutations-restored-from-durable-record');

            clockState.nowMs += 1;
            const humanClose = post(restarted.api, '/api/world/run/close', { participantId: human.participantId, runId: human.runId, mutationId: 'close:assign:human' });
            assert.equal(humanClose.status, 200);
            assert.equal(humanClose.body.accepted, true);
            assert.equal(humanClose.body.archivePersistence.persisted, true);
            assert.deepEqual(humanClose.body.archivePersistence.archive.mutations.map(entry => entry.action), ['train-unit-specialization', 'license-unit-vehicle', 'assign-vehicle', 'set-food-policy', 'close-active-run']);

            const restartedAfterClose = createApi({ accountPath, runStartPath, archivePath, clock });
            const terminal = get(restartedAfterClose.api, '/api/world/run', { participantId: human.participantId });
            assert.equal(terminal.status, 200);
            assert.equal(terminal.body.progression.activeRun, null);
            assert.equal(terminal.body.mutationContinuity.terminalCloseApplied, true);
            assert.equal(terminal.body.mutationContinuity.appliedMutationCountThisProcess, 5);

            const meta = get(restartedAfterClose.api, '/api/world/meta');
            assert.equal(meta.status, 200);
            assert.ok(meta.body.runLifecycle.hostAuthoritativeMutationActions.includes('assign-vehicle'));
            assert.equal(meta.body.runLifecycle.durableVehicleAssignmentEndpoint, '/api/world/run/assign-vehicle');
            assert.ok(meta.body.runLifecycle.progressionPersistence.durableMutationActions.includes('assign-vehicle'));
            assert.match(meta.body.runLifecycle.truthBoundary, /vehicle-assignment-reference/);

            console.log('world run durable host vehicle-assignment human/machine parity/order/idempotence/restart/archive selftest: PASS');
          } finally {
            fs.rmSync(tempDir, { recursive: true, force: true });
          }
          '''
          # Remove Python block indentation so JS imports begin at column 1.
          assignment_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in assignment_test.splitlines()) + '\n'
          Path('tests/world-run-vehicle-assignment-authority-selftest.mjs').write_text(assignment_test)

          workflow = '''name: World run host vehicle assignment authority

          on:
            pull_request:
              paths:
                - 'src/hosted/durable-world-run-command-authority.mjs'
                - 'src/hosted/world-run-http-api.mjs'
                - 'src/hosted/shared-world-authority-contract.mjs'
                - 'tests/shared-world-authority-contract-selftest.mjs'
                - 'tests/world-run-vehicle-assignment-authority-selftest.mjs'
                - '.github/workflows/world-run-vehicle-assignment-authority.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            durable-vehicle-assignment-authority:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    submodules: recursive
                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: '20'
                - name: Check authority sources
                  run: |
                    node --check src/hosted/durable-world-run-command-authority.mjs
                    node --check src/hosted/world-run-http-api.mjs
                    node --check src/hosted/shared-world-authority-contract.mjs
                    node --check tests/shared-world-authority-contract-selftest.mjs
                    node --check tests/world-run-vehicle-assignment-authority-selftest.mjs
                - name: Run full deterministic source suite
                  run: npm test
                - name: Exercise truthful shared-world authority contract
                  run: node tests/shared-world-authority-contract-selftest.mjs
                - name: Exercise durable vehicle assignment authority and restart replay
                  run: node tests/world-run-vehicle-assignment-authority-selftest.mjs
          '''
          workflow = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow.splitlines()) + '\n'
          Path('.github/workflows/world-run-vehicle-assignment-authority.yml').write_text(workflow)
          PY
      - name: Syntax and focused checks before commit
        run: |
          node --check src/hosted/durable-world-run-command-authority.mjs
          node --check src/hosted/world-run-http-api.mjs
          node --check src/hosted/shared-world-authority-contract.mjs
          node --check tests/world-run-vehicle-assignment-authority-selftest.mjs
          node tests/shared-world-authority-contract-selftest.mjs
          node tests/world-run-vehicle-assignment-authority-selftest.mjs

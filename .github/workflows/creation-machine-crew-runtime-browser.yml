name: Creation Machine Crew static runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - 'assets/creation-machine/prepare_runtime_glb.py'
      - 'assets/creation-machine/.gitignore'
      - 'assets/creation-machine/asset-index.csv'
      - 'assets/creation-machine/manifest.json'
      - 'src/assets/creation-machine-crew-set.mjs'
      - 'src/assets/cached-static-glb-runtime.mjs'
      - 'src/presentation/local-region-scene.mjs'
      - 'src/world/starter-region.mjs'
      - 'src/sim/local-region-sim.mjs'
      - 'game/creation-machine-crew-adoption.mjs'
      - 'tests/creation-machine-crew-set-selftest.mjs'
      - 'tests/browser/creation-machine-crew-set.spec.js'
      - 'docs/CREATION_MACHINE_CREW_STATIC_TRIAL_V0.md'
      - '.github/workflows/creation-machine-crew-runtime-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-in-creation-machine-crew-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Check out exact RTS candidate and pinned Planet
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare deterministic checked-in Creation Machine Crew derivatives
        run: |
          set -euo pipefail
          for asset in scavenger crew-worker mechanic-repair-crew citizen-harvester rifle-guard; do
            echo "preparing ${asset}"
            python3 assets/creation-machine/prepare_runtime_glb.py \
              --asset "$asset" \
              --variant far
          done

      - name: Verify source identities, stable Crew mappings and simulation targets
        run: node tests/creation-machine-crew-set-selftest.mjs

      - name: Syntax-check Crew runtime seam
        run: |
          node --check src/assets/creation-machine-crew-set.mjs
          node --check src/presentation/local-region-scene.mjs
          node --check game/creation-machine-crew-adoption.mjs
          node --check tests/creation-machine-crew-set-selftest.mjs
          node --check tests/browser/creation-machine-crew-set.spec.js

      - name: Regress deterministic local Crew and repository source gates
        run: |
          node tests/local-region-selftest.mjs
          node tests/local-crew-loop-selftest.mjs
          node tests/multiseat-input-selftest.mjs
          npm run test:shell

      - name: Install pinned Playwright browser test route
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Start actual Global State RTS shell with prepared Crew derivatives
        run: |
          node scripts/serve.mjs > /tmp/axm-global-state-rts-creation-machine-crew.log 2>&1 &
          for i in {1..30}; do
            ready=1
            for asset in scavenger crew-worker mechanic-repair-crew citizen-harvester rifle-guard; do
              curl --fail --silent "http://127.0.0.1:4174/assets/creation-machine/runtime-prepared/${asset}-lod1.glb" > /dev/null || ready=0
              curl --fail --silent "http://127.0.0.1:4174/assets/creation-machine/runtime-prepared/${asset}-lod1.receipt.json" > /dev/null || ready=0
            done
            if curl --fail --silent http://127.0.0.1:4174/game/ > /dev/null && [ "$ready" -eq 1 ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-global-state-rts-creation-machine-crew.log
          exit 1

      - name: Exercise representative Crew adoption through real four-seat LOCAL RTS
        run: |
          npx playwright test tests/browser/creation-machine-crew-set.spec.js --workers=1 --reporter=line
          mkdir -p evidence/creation-machine-crew-runtime
          cp test-results/global-state-rts-creation-machine-crew-*.png evidence/creation-machine-crew-runtime/

      - name: Regress four-controller and machine-seat browser shell
        run: npx playwright test tests/browser/planet-shell-controller.spec.js --reporter=line

      - name: Preserve Crew runtime evidence without committing generated derivatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-state-rts-creation-machine-crew-runtime-evidence
          path: |
            assets/creation-machine/runtime-prepared/*.receipt.json
            evidence/creation-machine-crew-runtime/*.png
            test-results/global-state-rts-*.png
            /tmp/axm-global-state-rts-creation-machine-crew.log
          if-no-files-found: warn
          retention-days: 14

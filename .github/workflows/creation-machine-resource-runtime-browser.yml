name: Creation Machine resource static runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - 'assets/creation-machine/**'
      - 'src/assets/creation-machine-resource-set.mjs'
      - 'src/assets/cached-static-glb-runtime.mjs'
      - 'src/sim/local-civilization-gameplay.mjs'
      - 'src/sim/construction-economy.mjs'
      - 'game/app.mjs'
      - 'game/creation-machine-resource-adoption.mjs'
      - 'tests/creation-machine-resource-set-selftest.mjs'
      - 'tests/browser/creation-machine-resource-set.spec.js'
      - 'docs/CREATION_MACHINE_RESOURCE_STATIC_TRIAL_V0.md'
      - '.github/workflows/creation-machine-resource-runtime-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-in-creation-machine-resource-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact RTS candidate and pinned Planet
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare deterministic checked-in mine-head far derivatives
        run: |
          set -euo pipefail
          python3 assets/creation-machine/prepare_runtime_glb.py \
            --asset shallow-mine-entrance \
            --variant far
          python3 assets/creation-machine/prepare_runtime_glb.py \
            --asset deep-mine-head \
            --variant far

      - name: Verify source identities, stable ID and live construction target
        run: node tests/creation-machine-resource-set-selftest.mjs

      - name: Syntax-check focused runtime seam
        run: |
          node --check src/assets/creation-machine-resource-set.mjs
          node --check game/creation-machine-resource-adoption.mjs
          node --check game/app.mjs
          node --check tests/creation-machine-resource-set-selftest.mjs
          node --check tests/browser/creation-machine-resource-set.spec.js

      - name: Regress construction, prior asset lanes and shell contracts
        run: |
          node tests/local-civilization-gameplay-selftest.mjs
          node tests/creation-machine-starter-set-selftest.mjs
          node tests/creation-machine-crew-set-selftest.mjs
          npm run test:shell

      - name: Install pinned Playwright browser test route
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Start actual Global State RTS shell with prepared resource derivatives
        run: |
          node scripts/serve.mjs > /tmp/axm-global-state-rts-creation-machine-resource.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4174/assets/creation-machine/runtime-prepared/shallow-mine-entrance-lod1.glb > /dev/null \
              && curl --fail --silent http://127.0.0.1:4174/assets/creation-machine/runtime-prepared/shallow-mine-entrance-lod1.receipt.json > /dev/null \
              && curl --fail --silent http://127.0.0.1:4174/assets/creation-machine/runtime-prepared/deep-mine-head-lod1.glb > /dev/null \
              && curl --fail --silent http://127.0.0.1:4174/assets/creation-machine/runtime-prepared/deep-mine-head-lod1.receipt.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-global-state-rts-creation-machine-resource.log
          exit 1

      - name: Exercise live Shallow Mine construction then explicit source-specific static adoption
        run: |
          npx playwright test tests/browser/creation-machine-resource-set.spec.js --workers=1 --reporter=line
          mkdir -p evidence/creation-machine-resource-runtime
          cp test-results/global-state-rts-creation-machine-shallow-mine-4seat.png evidence/creation-machine-resource-runtime/
          cp test-results/global-state-rts-creation-machine-deep-mine-head-4seat.png evidence/creation-machine-resource-runtime/

      - name: Regress player-facing LOCAL construction browser path
        run: npx playwright test tests/browser/local-civilization-gameplay.spec.js --workers=1 --reporter=line

      - name: Preserve resource runtime evidence without committing generated derivatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-state-rts-creation-machine-resource-runtime-evidence
          path: |
            assets/creation-machine/runtime-prepared/shallow-mine-entrance-lod1.receipt.json
            assets/creation-machine/runtime-prepared/deep-mine-head-lod1.receipt.json
            evidence/creation-machine-resource-runtime/*.png
            test-results/global-state-rts-*.png
            /tmp/axm-global-state-rts-creation-machine-resource.log
          if-no-files-found: warn
          retention-days: 14

name: Global salvage credit ledger

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/hosted/global-salvage-credit-ledger.mjs'
      - 'src/hosted/journal-store.mjs'
      - 'tests/global-salvage-credit-ledger-selftest.mjs'
      - 'docs/GLOBAL_SALVAGE_CREDIT_LEDGER_V0.md'
      - '.github/workflows/global-salvage-credit-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-global-credit-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run repository deterministic/source gates
        run: npm test
      - name: Check global-credit ledger syntax
        run: |
          node --check src/hosted/global-salvage-credit-ledger.mjs
          node --check tests/global-salvage-credit-ledger-selftest.mjs
      - name: Exercise persistence, idempotence, parity, restart, and tamper rejection
        run: node tests/global-salvage-credit-ledger-selftest.mjs

  chromium-world-entry-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic/source gates
        run: npm test
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start development world host
        run: |
          rm -f /tmp/axm-global-credit-world-journal.json /tmp/axm-global-credit-world-accounts.json
          AXM_SHARED_WRITE_MODE=dev \
          AXM_WORLD_JOURNAL_PATH=/tmp/axm-global-credit-world-journal.json \
          AXM_WORLD_ACCOUNTS_PATH=/tmp/axm-global-credit-world-accounts.json \
          node scripts/serve.mjs > /tmp/axm-global-credit-world-entry.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/world-entry.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-global-credit-world-entry.log
          exit 1
      - name: Exercise human/machine world entry in Chromium
        run: npx playwright test tests/browser/world-entry.spec.js --workers=1 --reporter=line
      - name: Preserve world-entry regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-salvage-credit-world-entry-regression
          path: |
            test-results/global-state-rts-world-entry.png
            test-results/global-state-rts-world-bound-seat.png
            /tmp/axm-global-credit-world-entry.log
          if-no-files-found: warn
          retention-days: 14

  chromium-controller-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic/source gates
        run: npm test
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start local browser shell
        run: |
          node scripts/serve.mjs > /tmp/axm-global-credit-controller.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-global-credit-controller.log
          exit 1
      - name: Exercise four controllers and machine seat in Chromium
        run: npx playwright test tests/browser/planet-shell-controller.spec.js --workers=1 --reporter=line
      - name: Preserve controller regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-salvage-credit-controller-regression
          path: |
            test-results/global-state-rts-*.png
            /tmp/axm-global-credit-controller.log
          if-no-files-found: warn
          retention-days: 14

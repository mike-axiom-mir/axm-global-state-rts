name: LOCAL combat gameplay proving ground

on:
  pull_request:
    paths:
      - game/combat-proving-ground.html
      - game/combat-proving-ground.mjs
      - src/sim/local-combat-gameplay.mjs
      - src/sim/local-casualty-reconciliation.mjs
      - src/sim/formation-combat.mjs
      - src/sim/local-civilization-gameplay.mjs
      - src/sim/local-party-gameplay.mjs
      - src/sim/local-region-sim.mjs
      - tests/local-combat-gameplay-selftest.mjs
      - tests/local-casualty-reconciliation-selftest.mjs
      - tests/combat-authority-selftest.mjs
      - tests/browser/local-combat-proving-ground.spec.js
      - .github/workflows/local-combat-gameplay.yml
      - scripts/serve.mjs
      - package.json
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-combat-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out game and pinned Planet
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run deterministic and combat integration gates
        run: |
          npm test
          node tests/combat-authority-selftest.mjs
          node tests/local-casualty-reconciliation-selftest.mjs
          node tests/local-combat-gameplay-selftest.mjs
          node --check src/sim/local-combat-gameplay.mjs
          node --check game/combat-proving-ground.mjs
          node --check tests/browser/local-combat-proving-ground.spec.js
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start local browser shell
        run: |
          node scripts/serve.mjs > /tmp/axm-global-state-rts-combat.log 2>&1 &
          echo $! > /tmp/axm-global-state-rts-combat.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/combat-proving-ground.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-global-state-rts-combat.log
          exit 1
      - name: Exercise LOCAL combat with virtual controller in Chromium
        run: npx playwright test tests/browser/local-combat-proving-ground.spec.js --reporter=line
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-state-rts-local-combat-proving-ground
          path: |
            test-results/global-state-rts-local-combat-proving-ground.png
            /tmp/axm-global-state-rts-combat.log
          if-no-files-found: warn
          retention-days: 14

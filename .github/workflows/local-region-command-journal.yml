name: Local region command journal authority

on:
  pull_request:
    paths:
      - 'src/hosted/local-region-command-journal-authority.mjs'
      - 'src/hosted/journal-store.mjs'
      - 'src/hosted/local-outcome-replay-authority.mjs'
      - 'src/sim/local-region-sim.mjs'
      - 'src/session/world-time-local-sync.mjs'
      - 'src/world/starter-region.mjs'
      - 'tests/local-region-command-journal-selftest.mjs'
      - 'tests/local-outcome-replay-authority-selftest.mjs'
      - 'docs/LOCAL_REGION_COMMAND_JOURNAL_V0.md'
      - '.github/workflows/local-region-command-journal.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full deterministic/source suite
        run: npm test
      - name: Syntax gate
        run: |
          node --check src/hosted/local-region-command-journal-authority.mjs
          node --check tests/local-region-command-journal-selftest.mjs
      - name: Prior single-outcome replay regression
        run: node tests/local-outcome-replay-authority-selftest.mjs
      - name: Chained host continuity selftest
        run: node tests/local-region-command-journal-selftest.mjs

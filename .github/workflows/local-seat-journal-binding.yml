name: Host local seat journal binding

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/hosted/local-seat-binding-store.mjs'
      - 'src/hosted/local-seat-journal-authority.mjs'
      - 'src/hosted/local-region-command-journal-authority.mjs'
      - 'src/hosted/verified-local-salvage-ledger.mjs'
      - 'src/hosted/verified-local-salvage-reservation-ledger.mjs'
      - 'src/hosted/world-session-authority.mjs'
      - 'src/hosted/world-http-api.mjs'
      - 'src/session/world-browser-client.mjs'
      - 'src/session/local-checkpoint-adoption.mjs'
      - 'src/sim/local-region-sim.mjs'
      - 'game/host-local-seat-checkpoint.mjs'
      - 'game/host-local-salvage-reservation.mjs'
      - 'game/index.html'
      - 'scripts/serve.mjs'
      - 'tests/local-outcome-replay-authority-selftest.mjs'
      - 'tests/local-seat-journal-authority-selftest.mjs'
      - 'tests/local-seat-restart-continuity-selftest.mjs'
      - 'tests/local-seat-http-authority-selftest.mjs'
      - 'tests/local-checkpoint-adoption-selftest.mjs'
      - 'tests/verified-local-salvage-selftest.mjs'
      - 'tests/verified-local-salvage-reservation-http-selftest.mjs'
      - 'tests/browser/local-seat-journal-binding.spec.js'
      - 'tests/browser/local-salvage-reservation.spec.js'
      - 'tests/browser/world-entry.spec.js'
      - 'docs/LOCAL_SEAT_JOURNAL_BINDING_V0.md'
      - 'docs/HOST_LOCAL_GATHER_COMMAND_V0.md'
      - 'docs/LOCAL_SEAT_RESTART_CONTINUITY_V0.md'
      - 'docs/HOST_CHECKPOINT_ADOPTION_V0.md'
      - 'docs/VERIFIED_LOCAL_SALVAGE_V0.md'
      - 'docs/VERIFIED_LOCAL_SALVAGE_RESERVATION_V0.md'
      - 'docs/VERIFIED_LOCAL_SALVAGE_RESERVATION_UI_V0.md'
      - '.github/workflows/local-seat-journal-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full deterministic and source suite
        run: npm test
      - name: Syntax gate for host local command, verified salvage, and reservation authority
        run: |
          node --check src/hosted/local-seat-binding-store.mjs
          node --check src/hosted/local-seat-journal-authority.mjs
          node --check src/hosted/verified-local-salvage-ledger.mjs
          node --check src/hosted/verified-local-salvage-reservation-ledger.mjs
          node --check src/hosted/world-session-authority.mjs
          node --check src/hosted/world-http-api.mjs
          node --check src/session/world-browser-client.mjs
          node --check src/session/local-checkpoint-adoption.mjs
          node --check src/sim/local-region-sim.mjs
          node --check game/host-local-seat-checkpoint.mjs
          node --check game/host-local-salvage-reservation.mjs
          node --check scripts/serve.mjs
          node --check tests/local-outcome-replay-authority-selftest.mjs
          node --check tests/local-seat-journal-authority-selftest.mjs
          node --check tests/local-seat-restart-continuity-selftest.mjs
          node --check tests/local-seat-http-authority-selftest.mjs
          node --check tests/local-checkpoint-adoption-selftest.mjs
          node --check tests/verified-local-salvage-selftest.mjs
          node --check tests/verified-local-salvage-reservation-http-selftest.mjs
          node --check tests/browser/local-seat-journal-binding.spec.js
          node --check tests/browser/local-salvage-reservation.spec.js
          node --check tests/browser/world-entry.spec.js
      - name: Exercise replay, chained journal, restart continuity, adoption, verified salvage, reservation HTTP, and bound host command authority
        run: |
          node tests/local-outcome-replay-authority-selftest.mjs
          node tests/local-region-command-journal-selftest.mjs
          node tests/local-seat-journal-authority-selftest.mjs
          node tests/local-seat-restart-continuity-selftest.mjs
          node tests/local-seat-http-authority-selftest.mjs
          node tests/local-checkpoint-adoption-selftest.mjs
          node tests/verified-local-salvage-selftest.mjs
          node tests/verified-local-salvage-reservation-http-selftest.mjs
          node tests/world-session-authority-selftest.mjs
          node tests/world-http-api-selftest.mjs
          node tests/world-browser-client-selftest.mjs

  chromium-bound-seat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deterministic/source prerequisite
        run: npm test
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start clean development world host with paired local-seat persistence
        run: |
          rm -rf /tmp/axm-local-seat-journals
          rm -f /tmp/axm-local-seat-bindings.json
          AXM_SHARED_WRITE_MODE=dev \
          AXM_WORLD_JOURNAL_PATH=/tmp/axm-local-seat-world-journal.json \
          AXM_WORLD_ACCOUNTS_PATH=/tmp/axm-local-seat-world-accounts.json \
          AXM_LOCAL_SEAT_BINDINGS_PATH=/tmp/axm-local-seat-bindings.json \
          AXM_LOCAL_SEAT_JOURNAL_DIR=/tmp/axm-local-seat-journals \
          node scripts/serve.mjs > /tmp/axm-local-seat-host.log 2>&1 &
          echo $! > /tmp/axm-local-seat-host.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/world-entry.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-local-seat-host.log
          exit 1
      - name: Exercise bound browser seat through host gather, verified salvage, reservation/release, and checkpoint adoption
        run: npx playwright test tests/browser/local-seat-journal-binding.spec.js tests/browser/local-salvage-reservation.spec.js --workers=1 --reporter=line
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-local-seat-journal-binding
          path: |
            test-results/global-state-rts-host-local-checkpoint.png
            test-results/global-state-rts-salvage-reservation.png
            /tmp/axm-local-seat-host.log
            /tmp/axm-local-seat-world-accounts.json
            /tmp/axm-local-seat-bindings.json
            /tmp/axm-local-seat-journals/*.jsonl
          if-no-files-found: warn
          retention-days: 14

  chromium-world-entry-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deterministic/source prerequisite
        run: npm test
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start clean development world host with durable local-seat configuration
        run: |
          rm -rf /tmp/axm-world-entry-local-seat-journals
          rm -f /tmp/axm-world-entry-local-seat-bindings.json
          AXM_SHARED_WRITE_MODE=dev \
          AXM_WORLD_JOURNAL_PATH=/tmp/axm-world-entry-world-journal.json \
          AXM_WORLD_ACCOUNTS_PATH=/tmp/axm-world-entry-world-accounts.json \
          AXM_LOCAL_SEAT_BINDINGS_PATH=/tmp/axm-world-entry-local-seat-bindings.json \
          AXM_LOCAL_SEAT_JOURNAL_DIR=/tmp/axm-world-entry-local-seat-journals \
          node scripts/serve.mjs > /tmp/axm-world-entry-host.log 2>&1 &
          echo $! > /tmp/axm-world-entry-host.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/world-entry.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-world-entry-host.log
          exit 1
      - name: Exercise human and machine world entry regression in Chromium
        run: npx playwright test tests/browser/world-entry.spec.js --workers=1 --reporter=line
      - name: Preserve world-entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-local-seat-world-entry-regression
          path: |
            test-results/global-state-rts-world-entry*.png
            /tmp/axm-world-entry-host.log
          if-no-files-found: warn
          retention-days: 14

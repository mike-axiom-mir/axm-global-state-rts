name: LOCAL strategic convoy proving ground

on:
  pull_request:
    paths:
      - 'src/sim/local-strategic-gameplay.mjs'
      - 'game/strategic-movement.html'
      - 'game/strategic-movement.mjs'
      - 'tests/local-strategic-gameplay-selftest.mjs'
      - 'tests/browser/local-strategic-movement.spec.js'
      - '.github/workflows/local-strategic-movement.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-strategic-convoy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out game and pinned Planet
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic/source gates
        run: |
          npm test
          node tests/local-strategic-gameplay-selftest.mjs
          node --check src/sim/local-strategic-gameplay.mjs
          node --check game/strategic-movement.mjs
          node --check tests/browser/local-strategic-movement.spec.js
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start local browser shell
        run: |
          node scripts/serve.mjs > /tmp/axm-global-state-rts-strategic-server.log 2>&1 &
          echo $! > /tmp/axm-global-state-rts-strategic-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/strategic-movement.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-global-state-rts-strategic-server.log
          exit 1
      - name: Exercise human controller and machine strategic movement in Chromium
        run: npx playwright test tests/browser/local-strategic-movement.spec.js --reporter=line
      - name: Preserve strategic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-state-rts-strategic-convoy
          path: |
            test-results/global-state-rts-strategic-convoy-*.png
            /tmp/axm-global-state-rts-strategic-server.log
          if-no-files-found: warn
          retention-days: 14

name: Local terrain surface render

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/presentation/local-surface-paint.mjs'
      - 'src/presentation/chunked-local-terrain.mjs'
      - 'src/world/local-battle-relief.mjs'
      - 'src/world/surface-sampler.mjs'
      - 'tests/battle-relief-selftest.mjs'
      - 'tests/presentation-selftest.mjs'
      - '.github/workflows/local-terrain-surface-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-terrain-surface-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate and pinned Planet
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify terrain and relief contracts
        run: |
          node tests/presentation-selftest.mjs
          node tests/battle-relief-selftest.mjs
          node --check src/presentation/local-surface-paint.mjs
          node --check src/presentation/chunked-local-terrain.mjs
          node --check src/world/local-battle-relief.mjs
          node --check src/world/surface-sampler.mjs

      - name: Install pinned Playwright browser route
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Start actual Global State RTS shell
        run: |
          node scripts/serve.mjs > /tmp/axm-global-state-rts-terrain.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-global-state-rts-terrain.log
          exit 1

      - name: Capture real LOCAL RTS surface
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const failures = [];
          page.on('pageerror', error => failures.push(`pageerror: ${error.message}`));
          page.on('console', message => { if (message.type() === 'error') failures.push(`console: ${message.text()}`); });
          const response = await page.goto('http://127.0.0.1:4174/game/?players=1', { waitUntil: 'networkidle' });
          if (!response?.ok()) throw new Error(`game shell failed: ${response?.status()}`);
          await page.keyboard.press('m');
          await page.waitForFunction(() => window.__AXM_GLOBAL_STATE_RTS__?.describeSeatView('seat-1')?.mode === 'local-rts');
          await page.waitForTimeout(1800);

          const closeView = await page.evaluate(() => window.__AXM_GLOBAL_STATE_RTS__.describeSeatView('seat-1'));
          if (closeView.local.distanceM !== 360) throw new Error(`unexpected default local distance ${closeView.local.distanceM}`);
          fs.mkdirSync('test-results', { recursive: true });
          fs.writeFileSync('test-results/local-terrain-surface-view.json', `${JSON.stringify(closeView, null, 2)}\n`);
          await page.screenshot({ path: 'test-results/local-terrain-surface.png', fullPage: true });

          // Use only the same wheel zoom available to a human player. This proves the larger
          // mountain/ridge/basin composition without a hidden test camera or special renderer path.
          const viewport = page.locator('#viewport');
          await viewport.hover();
          for (let index = 0; index < 10; index++) {
            await page.mouse.wheel(0, 600);
            await page.waitForTimeout(45);
          }
          await page.waitForTimeout(1300);
          const wideView = await page.evaluate(() => window.__AXM_GLOBAL_STATE_RTS__.describeSeatView('seat-1'));
          if (wideView.local.distanceM < 1200) throw new Error(`wide terrain proof did not zoom out far enough: ${wideView.local.distanceM}`);
          fs.writeFileSync('test-results/local-terrain-mountain-wide-view.json', `${JSON.stringify(wideView, null, 2)}\n`);
          await page.screenshot({ path: 'test-results/local-terrain-mountain-wide.png', fullPage: true });

          await browser.close();
          if (failures.length) throw new Error(failures.join('\n'));
          JS

      - name: Preserve terrain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-state-rts-local-terrain-surface
          path: |
            test-results/local-terrain-surface.png
            test-results/local-terrain-surface-view.json
            test-results/local-terrain-mountain-wide.png
            test-results/local-terrain-mountain-wide-view.json
            /tmp/axm-global-state-rts-terrain.log
          if-no-files-found: error
          retention-days: 14

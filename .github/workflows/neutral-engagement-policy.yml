name: Neutral engagement policy

on:
  push:
    paths:
      - 'src/sim/engagement-relations.mjs'
      - 'tests/engagement-relations-selftest.mjs'
      - '.github/workflows/neutral-engagement-policy.yml'
  pull_request:
    paths:
      - 'src/sim/engagement-relations.mjs'
      - 'tests/engagement-relations-selftest.mjs'
      - '.github/workflows/neutral-engagement-policy.yml'

jobs:
  deterministic-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check src/sim/engagement-relations.mjs
          node --check tests/engagement-relations-selftest.mjs
      - name: Neutral engagement selftest
        run: node tests/engagement-relations-selftest.mjs
      - name: Existing deterministic regression suite
        run: npm test

name: Persistent RPG clean branch

on:
  push:
    branches:
      - game/persistent-rpg-world-20260920
  workflow_dispatch:

jobs:
  verify-clean-rpg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RPG branch with Foundation Planet
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify clean RPG restart
        run: npm test

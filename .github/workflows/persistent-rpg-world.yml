name: Persistent RPG world

on:
  push:
    branches:
      - game/persistent-rpg-world-20260920
  workflow_dispatch:

jobs:
  deterministic-rpg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RPG branch with Foundation Planet
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax gate
        run: |
          node --check src/rpg/persistent-world.mjs
          node --check src/rpg/character-life.mjs
          node --check src/hosted/shared-state-authority.mjs
          node --check src/hosted/world-session-authority.mjs
          node --check src/hosted/world-http-api.mjs
          node --check src/session/world-seat-binding.mjs
          node --check src/session/world-browser-client.mjs
          node --check game/rpg-world.mjs

      - name: Deterministic world inheritance
        run: npm run test:rpg-world

      - name: Hosted hash-journal replay
        run: npm run test:rpg-hosted

      - name: Human and machine participant parity
        run: npm run test:rpg-participant

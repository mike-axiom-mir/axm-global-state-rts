name: Persistent world continuity checkpoint

on:
  pull_request:
    paths:
      - 'src/hosted/persistent-world-continuity-checkpoint.mjs'
      - 'tests/persistent-world-continuity-checkpoint-selftest.mjs'
      - '.github/workflows/persistent-world-continuity-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistent-world-continuity-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check checkpoint sources
        run: |
          node --check src/hosted/persistent-world-continuity-checkpoint.mjs
          node --check tests/persistent-world-continuity-checkpoint-selftest.mjs

      - name: Run full deterministic source suite
        run: npm test

      - name: Exercise durable checkpoint, guarded rollback, restart and tamper detection
        run: node tests/persistent-world-continuity-checkpoint-selftest.mjs

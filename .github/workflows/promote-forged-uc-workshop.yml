name: Promote forged UC workshop into RTS branch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/promote-forged-uc-workshop.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote-workshop:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'graphics/uc-workshop-rebuild'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '35060240363'
      SOURCE_ARTIFACT: global-state-rts-real-workshop-runtime-evidence
      DEST_DIR: assets/creation-machine/specialist-workshop
      EXPECTED_RTS_SHA256: 3cbe135aecabb2e3a2764bfb1fed9887c4c5035c97c4e690998cb82a456f299c
    steps:
      - name: Check out writable PR head branch
        uses: actions/checkout@v4
        with:
          ref: graphics/uc-workshop-rebuild
          submodules: false
          fetch-depth: 1

      - name: Download exact already-forged UC runtime evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/uc-workshop-evidence

      - name: Verify and stage exact RTS-tier asset
        run: |
          set -euo pipefail
          src_glb="$(find /tmp/uc-workshop-evidence -type f -name 'improvised-workshop-rts.glb' -print -quit)"
          src_verification="$(find /tmp/uc-workshop-evidence -type f -name 'verification.json' -print -quit)"
          src_inspection="$(find /tmp/uc-workshop-evidence -type f -name 'glb-inspection.json' -print -quit)"
          src_continuity="$(find /tmp/uc-workshop-evidence -type f -name 'semantic-continuity-receipt.json' -print -quit)"
          test -n "$src_glb" && test -n "$src_verification" && test -n "$src_inspection" && test -n "$src_continuity"
          mkdir -p "$DEST_DIR"
          cp "$src_glb" "$DEST_DIR/improvised-workshop-rts.glb"
          cp "$src_verification" "$DEST_DIR/producer-verification.json"
          cp "$src_inspection" "$DEST_DIR/producer-glb-inspection.json"
          cp "$src_continuity" "$DEST_DIR/semantic-continuity-receipt.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          dest = Path(os.environ['DEST_DIR'])
          glb = dest/'improvised-workshop-rts.glb'
          actual = hashlib.sha256(glb.read_bytes()).hexdigest()
          expected = os.environ['EXPECTED_RTS_SHA256']
          verification = json.loads((dest/'producer-verification.json').read_text())
          inspection = json.loads((dest/'producer-glb-inspection.json').read_text())['improvised-workshop-rts.glb']
          continuity = json.loads((dest/'semantic-continuity-receipt.json').read_text())
          assert actual == expected
          assert verification['artifacts']['improvised-workshop-rts.glb']['sha256'] == actual
          assert inspection['sha256'] == actual
          assert inspection['triangles'] == 9268
          assert inspection['material_batches'] == 19
          assert inspection['embedded_images'] == 47
          assert continuity['status'] == 'SEMANTIC_CONTINUITY_TESTED_BINARY_IDENTITY_FRESH'
          receipt = {
            'schema': 'axm.global-state-rts.promoted-uc-workshop/v0.1',
            'status': 'PROMOTED_PRESENTATION_CANDIDATE_NOT_CANON',
            'asset_id': 'building-workshop-a',
            'source_repository': 'mike-axiom-mir/axm-universal-creation',
            'source_commit': continuity['producer_source_commit'],
            'source_workflow_run': int(os.environ['SOURCE_RUN_ID']),
            'filename': glb.name,
            'sha256': actual,
            'triangles': inspection['triangles'],
            'material_batches': inspection['material_batches'],
            'embedded_images': inspection['embedded_images'],
            'truth_boundary': [
              'Exact promoted bytes are producer/inspection hash-bound.',
              'Promotion does not create CANON world authority.',
              'Visual acceptance remains based on target-render evidence.',
              'Collision, navigation and target-device FPS remain separately governed.'
            ]
          }
          (dest/'promotion-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Commit candidate bytes to the PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST_DIR"
          if git diff --cached --quiet; then
            echo 'Exact promoted workshop already present; no commit needed.'
            exit 0
          fi
          git commit -m 'Assets: promote exact UC RTS workshop candidate'
          git push origin HEAD:graphics/uc-workshop-rebuild

name: Salvage transfer global finalization

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/hosted/finalized-settlement-world-session-authority.mjs'
      - 'src/hosted/finalized-settlement-world-http-api.mjs'
      - 'src/hosted/global-salvage-credit-ledger.mjs'
      - 'src/hosted/settlement-world-session-authority.mjs'
      - 'src/hosted/salvage-transfer-transaction-journal.mjs'
      - 'src/hosted/verified-local-salvage-reservation-ledger.mjs'
      - 'scripts/serve.mjs'
      - 'tests/salvage-transfer-global-finalization-selftest.mjs'
      - 'docs/SALVAGE_TRANSFER_GLOBAL_FINALIZATION_V0.md'
      - '.github/workflows/salvage-transfer-global-finalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-global-finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run repository deterministic/source gates
        run: npm test
      - name: Check finalization source syntax
        run: |
          node --check src/hosted/finalized-settlement-world-session-authority.mjs
          node --check src/hosted/finalized-settlement-world-http-api.mjs
          node --check tests/salvage-transfer-global-finalization-selftest.mjs
          node --check scripts/serve.mjs
      - name: Exercise finalization, parity, retry, and restart reconciliation
        run: node tests/salvage-transfer-global-finalization-selftest.mjs

  chromium-world-entry-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic/source gates
        run: npm test
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start durable finalization host
        run: |
          rm -rf /tmp/axm-finalization-seats
          rm -f /tmp/axm-finalization-world.jsonl /tmp/axm-finalization-accounts.json /tmp/axm-finalization-bindings.json /tmp/axm-finalization-transfers.jsonl /tmp/axm-finalization-global-credits.jsonl
          AXM_SHARED_WRITE_MODE=dev \
          AXM_WORLD_JOURNAL_PATH=/tmp/axm-finalization-world.jsonl \
          AXM_WORLD_ACCOUNTS_PATH=/tmp/axm-finalization-accounts.json \
          AXM_LOCAL_SEAT_BINDINGS_PATH=/tmp/axm-finalization-bindings.json \
          AXM_LOCAL_SEAT_JOURNAL_DIR=/tmp/axm-finalization-seats \
          AXM_SALVAGE_TRANSFER_JOURNAL_PATH=/tmp/axm-finalization-transfers.jsonl \
          AXM_GLOBAL_SALVAGE_CREDIT_JOURNAL_PATH=/tmp/axm-finalization-global-credits.jsonl \
          node scripts/serve.mjs > /tmp/axm-finalization-world-entry.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/world-entry.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-finalization-world-entry.log
          exit 1
      - name: Exercise human/machine world entry in Chromium
        run: npx playwright test tests/browser/world-entry.spec.js --workers=1 --reporter=line
      - name: Preserve world-entry regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salvage-transfer-global-finalization-world-entry
          path: |
            test-results/global-state-rts-world-entry.png
            test-results/global-state-rts-world-bound-seat.png
            /tmp/axm-finalization-world-entry.log
          if-no-files-found: warn
          retention-days: 14

  chromium-controller-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic/source gates
        run: npm test
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start local browser shell
        run: |
          node scripts/serve.mjs > /tmp/axm-finalization-controller.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/game/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-finalization-controller.log
          exit 1
      - name: Exercise four controllers and machine seat in Chromium
        run: npx playwright test tests/browser/planet-shell-controller.spec.js --workers=1 --reporter=line
      - name: Preserve controller regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salvage-transfer-global-finalization-controller
          path: |
            test-results/global-state-rts-*.png
            /tmp/axm-finalization-controller.log
          if-no-files-found: warn
          retention-days: 14

name: Strategic music realization bindings

on:
  pull_request:
    paths:
      - 'assets/music/global-pressure-score.json'
      - 'assets/music/global-pressure-realization.json'
      - 'scripts/verify-strategic-music-realization.py'
      - '.github/workflows/strategic-music-realization.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RTS candidate
        uses: actions/checkout@v4

      - name: Checkout pinned Music Maker
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-music-maker
          ref: 6257e2763cac3e64822867ce325e844a0f03cfd3
          path: .deps/axm-music-maker
          persist-credentials: false

      - name: Checkout pinned Audio Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-audio-fabric
          ref: 19246a121791e546defeb7d83743cc7f755826d3
          path: .deps/axm-audio-fabric
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact shared-source pins
        run: |
          test "$(git -C .deps/axm-music-maker rev-parse HEAD)" = "6257e2763cac3e64822867ce325e844a0f03cfd3"
          test "$(git -C .deps/axm-audio-fabric rev-parse HEAD)" = "19246a121791e546defeb7d83743cc7f755826d3"

      - name: Run pinned Music Maker unit suite
        working-directory: .deps/axm-music-maker
        run: python -m unittest discover -s tests -v

      - name: Validate product realization bindings and render plans
        run: |
          rm -rf out/strategic-music-realization
          python scripts/verify-strategic-music-realization.py \
            --music-maker-path .deps/axm-music-maker \
            --audio-fabric-path .deps/axm-audio-fabric \
            --out-dir out/strategic-music-realization

      - name: Require handoff evidence
        run: |
          test -s out/strategic-music-realization/exploration-music-maker-plan.json
          test -s out/strategic-music-realization/combat-music-maker-plan.json
          test -s out/strategic-music-realization/verification.json

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategic-music-realization-evidence-${{ github.run_id }}
          path: out/strategic-music-realization/
          if-no-files-found: warn

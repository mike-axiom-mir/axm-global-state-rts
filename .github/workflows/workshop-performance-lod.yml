name: Workshop detailed vs LOD1 target cost

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tests/browser/workshop-lod-performance.spec.js'
      - '.github/workflows/workshop-performance-lod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workshop-relative-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UC_SOURCE_COMMIT: d761090dd6477db9b8dd33edac905ff924c4c6ee
    steps:
      - name: Check out exact RTS candidate and pinned Planet
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch exact Universal Creation specialist source
        run: |
          rm -rf /tmp/axm-universal-creation
          git init /tmp/axm-universal-creation
          git -C /tmp/axm-universal-creation remote add origin https://github.com/mike-axiom-mir/axm-universal-creation.git
          git -C /tmp/axm-universal-creation fetch --depth=1 origin "$UC_SOURCE_COMMIT"
          git -C /tmp/axm-universal-creation checkout --detach FETCH_HEAD
          test "$(git -C /tmp/axm-universal-creation rev-parse HEAD)" = "$UC_SOURCE_COMMIT"

      - name: Provision Universal Creation Blender route
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'Pillow>=10,<12' 'bpy==4.3.0'
          python - <<'PY'
          import bpy
          assert bpy.app.version[:2] == (4, 3)
          print('bpy', bpy.app.version_string)
          PY

      - name: Rebuild detailed and LOD1 workshop variants
        run: |
          rm -rf "$GITHUB_WORKSPACE/runtime-assets/workshop-specialist"
          mkdir -p "$GITHUB_WORKSPACE/runtime-assets"
          cd /tmp/axm-universal-creation
          PYTHONPATH=src python -m axm_uc rts-workshop-polish "$GITHUB_WORKSPACE/runtime-assets/workshop-specialist" \
            --python "$(command -v python)" \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            --resolution 512 \
            --samples 8

      - name: Verify semantic continuity before measuring variants
        run: |
          PYTHONPATH=/tmp/axm-universal-creation/tools/blender \
            python /tmp/axm-universal-creation/tools/blender/verify_rts_workshop.py "$GITHUB_WORKSPACE/runtime-assets/workshop-specialist"
          python scripts/verify-specialist-workshop-semantic.py \
            --reference assets/specialist-workshop-semantic-reference.v0.1.json \
            --verification runtime-assets/workshop-specialist/verification.json \
            --inspection runtime-assets/workshop-specialist/glb-inspection.json \
            --write runtime-assets/workshop-specialist/semantic-continuity-receipt.json

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned Playwright browser route
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Start Global State RTS with both real workshop variants
        run: |
          node scripts/serve.mjs > /tmp/axm-global-state-rts-workshop-performance.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/runtime-assets/workshop-specialist/improvised-workshop.glb > /dev/null \
              && curl --fail --silent http://127.0.0.1:4174/runtime-assets/workshop-specialist/improvised-workshop-lod1.glb > /dev/null \
              && curl --fail --silent http://127.0.0.1:4174/runtime-assets/workshop-specialist/verification.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-global-state-rts-workshop-performance.log
          exit 1

      - name: Compare detailed and LOD1 in one- and four-seat target views
        run: npx playwright test tests/browser/workshop-lod-performance.spec.js --reporter=line

      - name: Preserve cost/readability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-lod-target-cost-evidence
          path: |
            test-results/workshop-lod-performance-evidence.json
            test-results/workshop-detailed-1seat.png
            test-results/workshop-lod1-1seat.png
            test-results/workshop-detailed-4seat.png
            test-results/workshop-lod1-4seat.png
            runtime-assets/workshop-specialist/semantic-continuity-receipt.json
            runtime-assets/workshop-specialist/game-readiness-gates.json
            /tmp/axm-global-state-rts-workshop-performance.log
          if-no-files-found: warn
          retention-days: 14

name: World run host food policy authority

on:
  pull_request:
    paths:
      - 'src/hosted/durable-world-run-mutation-authority.mjs'
      - 'src/hosted/world-run-http-api.mjs'
      - 'tests/world-run-food-policy-authority-selftest.mjs'
      - '.github/workflows/world-run-food-policy-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-food-policy-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check authority sources
        run: |
          node --check src/hosted/durable-world-run-mutation-authority.mjs
          node --check src/hosted/world-run-http-api.mjs
          node --check tests/world-run-food-policy-authority-selftest.mjs
      - name: Run full deterministic source suite
        run: npm test
      - name: Exercise durable food policy authority and restart replay
        run: node tests/world-run-food-policy-authority-selftest.mjs

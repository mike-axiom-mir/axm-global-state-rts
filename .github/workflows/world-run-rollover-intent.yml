name: World run durable rollover intent

on:
  pull_request:
    paths:
      - 'src/hosted/world-run-start-store.mjs'
      - 'src/hosted/prepared-world-run-rollover-authority.mjs'
      - 'src/hosted/world-run-http-api.mjs'
      - 'tests/world-run-rollover-intent-selftest.mjs'
      - '.github/workflows/world-run-rollover-intent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-rollover-intent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check rollover authority sources
        run: |
          node --check src/hosted/world-run-start-store.mjs
          node --check src/hosted/prepared-world-run-rollover-authority.mjs
          node --check src/hosted/world-run-http-api.mjs
          node --check tests/world-run-rollover-intent-selftest.mjs
      - name: Run full deterministic source suite
        run: npm test
      - name: Exercise archive-bound rollover preparation and restart validation
        run: node tests/world-run-rollover-intent-selftest.mjs
